# Application
spring.application.name=RentWheelsX
server.port=9000

# =============================================
# PostgreSQL Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rentwheelsx
spring.datasource.username=postgres
spring.datasource.password=880173
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=RentWheelsXSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm
app.jwt.expiration-ms=86400000

# =============================================
# Logging
# =============================================
logging.level.com.rentwheelsx=DEBUG